# Intel Policy - Single Source of Truth
# Version: 1.0

version: 1.0

# Source filtering (Steam-only for autopublish)
# GLOBAL MODE: Expanded domains for high-noise collection
allowed_domains:
  # Official Steam
  - store.steampowered.com
  - steamcommunity.com
  - steamdb.info
  - rss.steampowered.com
  - partner.steamgames.com
  # Major Gaming Media (EN)
  - pcgamer.com
  - ign.com
  - rockpapershotgun.com
  - gamesindustry.biz
  - eurogamer.net
  - kotaku.com
  - destructoid.com
  - gamespot.com
  - vg247.com
  - polygon.com
  - theverge.com
  - gameinformer.com
  - giantbomb.com
  - techraptor.net
  - nichegamer.com
  - gamingbolt.com
  - twinfinite.net
  - gamerant.com
  - screenrant.com
  # International Media
  - jeuxvideo.com
  - 3djuegos.com
  - gamestar.de
  - gamepressure.com
  - 4gamer.net
  - famitsu.com
  - dtf.ru
  - stopgame.ru
  - ixbt.com
  - igromania.ru
  - gamer.com.tw
  - inven.co.kr
  - playground.ru
  - kanobu.ru
  - gamekult.com
  - multiplayer.it
  - eurogamer.it
  # Aggregators
  - news.google.com
  - reddit.com
  - bing.com
blocked_domains: []

# Event types configuration
allowed_event_types_for_autopublish:
  - release
  - patch_major
  - discount
  - publisher_deal
  - funding
  - market_trend

always_needs_review_event_types:
  - controversy

# Hard rules for LLM and content generation
hard_rules:
  no_fabrication: true
  numbers_must_come_from:
    - steam_snapshot
    - extracted_text
    - key_facts
  if_missing_data_write: "нет данных"
  output_language: ru
  strict_russian_output: true  # All Telegram messages must be in Russian

# Global mode configuration
mode: high_noise  # High-noise global collection mode

# Steam relevance filtering
steam_relevance_required: true  # Only process items relevant to Steam
relevance:
  steam_keywords:
    - steam
    - valve
    - steam deck
    - steam release
    - steam update
    - steam discount
    - steam sale
    - steam game
    - steam store
    - steam community
    - steamdb
    - appid
    - steam app
  require_steam_mention: true
  min_relevance_score: 18  # Lowered by 10% (was 20) to increase extraction rate

# Telegram template configuration
telegram_template:
  max_chars: 3500
  format:
    - title
    - what_happened
    - why_it_matters
    - bullets
    - sources

# Rate limits
limits:
  max_posts_per_hour: 5
  max_posts_per_day: 30

# Moderation rules
moderation:
  unresolved_entity_policy: needs_review
  low_confidence_threshold: 0.68  # Lowered by 10% (was 0.75)

# Significance scoring and filtering
significance:
  min_score_to_autopublish: 32  # Lowered by 10% (was 35) to increase eligible events
  min_confidence_to_autopublish: 0.63  # Lowered by 10% (was 0.7) to allow more events
  always_publish_categories: [funding, publisher_deal]
  never_autopublish_categories: [controversy]
